name: Site checks

# GitHub-hosted runners: a public repository must never run pull requests
# from forks on a machine it doesn't throw away after each job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate and the demo playthrough run side by side; `test` below is the
  # required check and passes only when both did.
  gate:
    name: Type check, tests and links
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.28.6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `playwright install-deps`: the hosted image already has every
      # library Chrome needs, and the step only added fonts, at 12s to 8 min
      # of apt mirror time. A missing library fails Chrome's launch loudly.
      - name: Install pinned patched Chrome for Testing
        run: bash scripts/install-browser-ci.sh
      - name: Test browser version guard
        run: pnpm test:browser-runtime

      # The same gate AGENTS.md documents for pre-push.
      - name: Type check, unit tests, fixture build, e2e, and link check
        run: pnpm check

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  demos:
    name: Production build and demos
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.28.6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `playwright install-deps`: the hosted image already has every
      # library Chrome needs, and the step only added fonts, at 12s to 8 min
      # of apt mirror time. A missing library fails Chrome's launch loudly.
      - name: Install pinned patched Chrome for Testing
        run: bash scripts/install-browser-ci.sh

      # The real site: oneshots at the pinned commit, then every demo played
      # in its sandbox, failing on any request to another host.
      - name: Production build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Play every oneshot demo
        run: node scripts/check-demos.mjs

  # Required check. Branch protection names this job, so keep its id; it fails
  # unless every job above passed, including when one was cancelled.
  test:
    if: ${{ always() }}
    needs: [gate, demos]
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    steps:
      - name: Require the gate and the demos
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          DEMOS_RESULT: ${{ needs.demos.result }}
        run: |
          echo "gate=$GATE_RESULT demos=$DEMOS_RESULT"
          test "$GATE_RESULT" = success
          test "$DEMOS_RESULT" = success
