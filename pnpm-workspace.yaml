# Supply-chain quarantine: refuse package versions published in the last 7 days.
# For an urgent fix, list the package under minimumReleaseAgeExclude and remove
# it once the release ages past the window.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  sharp: true

# Temporary exact exception for retiring the reviewed browser replacement.
# Remove after playwright-core 1.65.0 reaches seven days (2026-11-12 20:17 UTC).
minimumReleaseAgeExclude:
  - '@playwright/test@1.65.0'
  - 'playwright@1.65.0'
  - 'playwright-core@1.65.0'
